server {
    listen 80;
    server_name _;
    client_max_body_size 15M;  # resumes can include images; allow reasonably large PDFs

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /analyze/ {
        proxy_pass http://backend:8000/analyze/;
        proxy_read_timeout 60s;
    }
}
