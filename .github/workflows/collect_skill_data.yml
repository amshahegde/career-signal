name: Collect Daily Skill Snapshot

on:
  schedule:
    # Runs once a day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        run: python backend/collectors/remoteok_collector.py

      - name: Commit updated snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_skill_snapshots.csv
          git diff --quiet --cached || git commit -m "Add daily skill snapshot ($(date -u +%Y-%m-%d))"
          git push
